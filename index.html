<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe Arena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&amp;family=Rajdhani:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
    }
    
    .font-orbitron { font-family: 'Orbitron', monospace; }
    .font-rajdhani { font-family: 'Rajdhani', sans-serif; }
    
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 170, 0.3); }
      50% { box-shadow: 0 0 40px rgba(0, 255, 170, 0.6); }
    }
    
    @keyframes winner-celebration {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .cell-hover:hover:not(.disabled) {
      background: linear-gradient(135deg, rgba(0, 255, 170, 0.2), rgba(0, 200, 255, 0.2));
      transform: scale(1.02);
    }
    
    .winner-line {
      animation: pulse-glow 1s ease-in-out infinite;
    }
    
    .winner-cell {
      animation: winner-celebration 0.5s ease-in-out infinite;
    }
    
    .game-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    
    .neon-text {
      text-shadow: 0 0 10px currentColor, 0 0 20px currentColor;
    }
    
    .glass-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #00ffaa, #00c8ff);
      transition: all 0.3s ease;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 255, 170, 0.4);
    }
    
    .btn-secondary {
      background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
      border: 2px solid rgba(0, 255, 170, 0.5);
      transition: all 0.3s ease;
    }
    
    .btn-secondary:hover {
      background: linear-gradient(135deg, rgba(0, 255, 170, 0.2), rgba(0, 200, 255, 0.2));
      border-color: #00ffaa;
    }
    
    .difficulty-btn {
      transition: all 0.3s ease;
    }
    
    .difficulty-btn.selected {
      transform: scale(1.05);
      box-shadow: 0 0 20px currentColor;
    }
    
    .x-mark {
      color: #ff6b6b;
      text-shadow: 0 0 15px #ff6b6b;
    }
    
    .o-mark {
      color: #4ecdc4;
      text-shadow: 0 0 15px #4ecdc4;
    }
    
    .current-turn {
      animation: pulse-glow 1.5s ease-in-out infinite;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full bg-slate-900 font-rajdhani text-white overflow-auto">
  <div id="app" class="min-h-full w-full bg-gradient-to-br from-slate-900 via-purple-900/20 to-slate-900 p-4 md:p-8"><!-- Name Entry Screen -->
   <div id="name-screen" class="max-w-2xl mx-auto">
    <h1 id="name-screen-title" class="text-4xl md:text-6xl font-orbitron font-black text-center mb-8 bg-gradient-to-r from-emerald-400 via-cyan-400 to-emerald-400 bg-clip-text text-transparent neon-text">Tic-Tac-Toe Arena</h1>
    <div class="glass-card rounded-2xl p-6 md:p-8">
     <h2 id="name-prompt" class="text-2xl font-orbitron font-bold text-emerald-400 mb-6 text-center">Enter Your Name</h2>
     <div class="mb-6"><input id="player-name-input" type="text" placeholder="Your name here..." maxlength="20" class="w-full px-4 py-3 bg-slate-800/50 border-2 border-emerald-500/50 rounded-lg text-white text-lg font-rajdhani placeholder-slate-500 focus:outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-400/30" onkeypress="if(event.key==='Enter') submitPlayerName()">
      <p id="name-error" class="text-red-400 text-sm mt-2 hidden">Please enter a name (2-20 characters)</p>
     </div><button onclick="submitPlayerName()" class="btn-primary w-full py-4 rounded-xl text-slate-900 font-orbitron font-bold text-xl"> ➜ Continue </button>
    </div>
   </div><!-- Setup Screen -->
   <div id="setup-screen" class="hidden max-w-2xl mx-auto">
    <h1 id="game-title" class="text-4xl md:text-6xl font-orbitron font-black text-center mb-8 bg-gradient-to-r from-emerald-400 via-cyan-400 to-emerald-400 bg-clip-text text-transparent neon-text">Tic-Tac-Toe Arena</h1>
    <div class="glass-card rounded-2xl p-6 md:p-8 mb-6">
     <h2 class="text-2xl font-orbitron font-bold text-emerald-400 mb-6 text-center">Choose Players</h2><!-- Player X Setup -->
     <div class="mb-6"><label class="block text-lg font-bold text-red-400 mb-3 flex items-center gap-2"> <span class="text-3xl x-mark">✕</span> <span id="player-x-title">Player X</span> </label>
      <div class="grid grid-cols-2 gap-3"><button onclick="setPlayerType('X', 'human')" id="x-human-btn" class="difficulty-btn p-3 rounded-xl bg-gradient-to-r from-red-500/20 to-red-600/20 border-2 border-red-500/50 text-red-300 font-bold selected"> 👤 Human </button> <button onclick="setPlayerType('X', 'bot')" id="x-bot-btn" class="difficulty-btn p-3 rounded-xl bg-gradient-to-r from-red-500/20 to-red-600/20 border-2 border-red-500/30 text-red-300/70 font-bold"> 🤖 Bot </button>
      </div>
      <div id="x-difficulty" class="hidden mt-3 grid grid-cols-3 gap-2"><button onclick="setBotDifficulty('X', 'easy')" class="x-diff-btn p-2 rounded-lg bg-green-500/20 border border-green-500/50 text-green-400 text-sm font-bold">Easy</button> <button onclick="setBotDifficulty('X', 'normal')" class="x-diff-btn p-2 rounded-lg bg-yellow-500/20 border border-yellow-500/50 text-yellow-400 text-sm font-bold">Normal</button> <button onclick="setBotDifficulty('X', 'hard')" class="x-diff-btn p-2 rounded-lg bg-red-500/20 border border-red-500/50 text-red-400 text-sm font-bold">Hard</button>
      </div>
     </div><!-- Player O Setup -->
     <div><label class="block text-lg font-bold text-cyan-400 mb-3 flex items-center gap-2"> <span class="text-3xl o-mark">○</span> <span id="player-o-title">Player O</span> </label>
      <div class="grid grid-cols-2 gap-3"><button onclick="setPlayerType('O', 'human')" id="o-human-btn" class="difficulty-btn p-3 rounded-xl bg-gradient-to-r from-cyan-500/20 to-cyan-600/20 border-2 border-cyan-500/50 text-cyan-300 font-bold selected"> 👤 Human </button> <button onclick="setPlayerType('O', 'bot')" id="o-bot-btn" class="difficulty-btn p-3 rounded-xl bg-gradient-to-r from-cyan-500/20 to-cyan-600/20 border-2 border-cyan-500/30 text-cyan-300/70 font-bold"> 🤖 Bot </button>
      </div>
      <div id="o-difficulty" class="hidden mt-3 grid grid-cols-3 gap-2"><button onclick="setBotDifficulty('O', 'easy')" class="o-diff-btn p-2 rounded-lg bg-green-500/20 border border-green-500/50 text-green-400 text-sm font-bold">Easy</button> <button onclick="setBotDifficulty('O', 'normal')" class="o-diff-btn p-2 rounded-lg bg-yellow-500/20 border border-yellow-500/50 text-yellow-400 text-sm font-bold">Normal</button> <button onclick="setBotDifficulty('O', 'hard')" class="o-diff-btn p-2 rounded-lg bg-red-500/20 border border-red-500/50 text-red-400 text-sm font-bold">Hard</button>
      </div>
     </div>
    </div><button onclick="startGame()" class="btn-primary w-full py-4 rounded-xl text-slate-900 font-orbitron font-bold text-xl"> 🎮 Start Game </button>
   </div><!-- Game Screen -->
   <div id="game-screen" class="hidden max-w-lg mx-auto">
    <h1 id="game-title-playing" class="text-3xl md:text-4xl font-orbitron font-black text-center mb-4 bg-gradient-to-r from-emerald-400 via-cyan-400 to-emerald-400 bg-clip-text text-transparent">Tic-Tac-Toe Arena</h1><!-- Score Board -->
    <div class="glass-card rounded-xl p-4 mb-4 flex justify-between items-center">
     <div id="score-x" class="text-center">
      <div class="text-2xl font-bold x-mark">
       ✕
      </div>
      <div id="x-name" class="text-sm text-red-300">
       Player X
      </div>
      <div id="x-score" class="text-2xl font-orbitron font-bold text-red-400">
       0
      </div>
     </div>
     <div class="text-center">
      <div class="text-sm text-slate-400">
       DRAWS
      </div>
      <div id="draws" class="text-2xl font-orbitron font-bold text-slate-300">
       0
      </div>
     </div>
     <div id="score-o" class="text-center">
      <div class="text-2xl font-bold o-mark">
       ○
      </div>
      <div id="o-name" class="text-sm text-cyan-300">
       Player O
      </div>
      <div id="o-score" class="text-2xl font-orbitron font-bold text-cyan-400">
       0
      </div>
     </div>
    </div><!-- Turn Indicator -->
    <div id="turn-indicator" class="glass-card rounded-xl p-3 mb-4 text-center current-turn"><span id="turn-text" class="font-bold text-lg">X's Turn</span>
    </div><!-- Game Board -->
    <div class="glass-card rounded-2xl p-4 mb-4">
     <div id="board" class="game-board"><!-- Cells will be generated by JS -->
     </div>
    </div><!-- Game Controls -->
    <div class="flex gap-3"><button onclick="resetGame()" class="btn-secondary flex-1 py-3 rounded-xl font-bold text-emerald-400"> 🔄 New Round </button> <button onclick="backToSetup()" class="btn-secondary flex-1 py-3 rounded-xl font-bold text-purple-400"> ⚙️ Settings </button>
    </div><!-- Winner Modal -->
    <div id="winner-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
     <div class="glass-card rounded-2xl p-8 text-center max-w-sm w-full" style="animation: slide-in 0.3s ease-out">
      <div id="winner-icon" class="text-6xl mb-4">
       🏆
      </div>
      <h2 id="winner-text" class="text-3xl font-orbitron font-bold mb-6 bg-gradient-to-r from-yellow-400 to-orange-400 bg-clip-text text-transparent">X Wins!</h2>
      <div class="flex gap-3"><button onclick="playAgain()" class="btn-primary flex-1 py-3 rounded-xl text-slate-900 font-bold"> Play Again </button> <button onclick="closeModal()" class="btn-secondary flex-1 py-3 rounded-xl font-bold text-slate-300"> Close </button>
      </div>
     </div>
    </div>
   </div>
  </div>
  <script>
    // Default configuration
    const defaultConfig = {
      game_title: 'Tic-Tac-Toe Arena',
      player_x_label: 'Player X',
      player_o_label: 'Player O',
      bg_color: '#0f172a',
      surface_color: '#1e293b',
      text_color: '#f1f5f9',
      primary_color: '#00ffaa',
      accent_color: '#00c8ff'
    };

    // Game state
    let gameState = {
      board: ['', '', '', '', '', '', '', '', ''],
      currentPlayer: 'X',
      gameActive: false,
      players: {
        X: { type: 'human', difficulty: 'normal', name: '' },
        O: { type: 'human', difficulty: 'normal', name: '' }
      },
      scores: { X: 0, O: 0, draws: 0 },
      winningCells: [],
      humanPlayers: { X: 0, O: 0 }
    };

    const winPatterns = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
      [0, 4, 8], [2, 4, 6]             // Diagonals
    ];

    function submitPlayerName() {
      const input = document.getElementById('player-name-input');
      const name = input.value.trim();
      const errorMsg = document.getElementById('name-error');
      
      if (name.length < 2 || name.length > 20) {
        errorMsg.classList.remove('hidden');
        return;
      }
      
      // Check if this is first or second human player
      const humanCount = Object.values(gameState.humanPlayers).reduce((a, b) => a + b, 0);
      
      if (humanCount === 0) {
        // First human player is X
        gameState.players.X.name = name;
        gameState.humanPlayers.X = 1;
        document.getElementById('name-screen').classList.add('hidden');
        document.getElementById('setup-screen').classList.remove('hidden');
      } else if (humanCount === 1 && gameState.players.X.type === 'bot') {
        // Second human player is O (if X is bot)
        gameState.players.O.name = name;
        gameState.humanPlayers.O = 1;
        document.getElementById('name-screen').classList.add('hidden');
        document.getElementById('setup-screen').classList.remove('hidden');
      } else {
        // Second human player is O
        gameState.players.O.name = name;
        gameState.humanPlayers.O = 1;
        document.getElementById('name-screen').classList.add('hidden');
        document.getElementById('setup-screen').classList.remove('hidden');
      }
      
      input.value = '';
      errorMsg.classList.add('hidden');
    }

    // Initialize Element SDK
    window.elementSdk.init({
      defaultConfig,
      onConfigChange: async (config) => {
        // Update game title
        const title = config.game_title || defaultConfig.game_title;
        document.getElementById('game-title').textContent = title;
        document.getElementById('game-title-playing').textContent = title;
        
        // Update player labels
        const xLabel = config.player_x_label || defaultConfig.player_x_label;
        const oLabel = config.player_o_label || defaultConfig.player_o_label;
        document.getElementById('player-x-title').textContent = xLabel;
        document.getElementById('player-o-title').textContent = oLabel;
        document.getElementById('x-name').textContent = gameState.players.X.type === 'bot' ? `🤖 ${xLabel}` : xLabel;
        document.getElementById('o-name').textContent = gameState.players.O.type === 'bot' ? `🤖 ${oLabel}` : oLabel;
        
        // Apply colors
        const bgColor = config.bg_color || defaultConfig.bg_color;
        const primaryColor = config.primary_color || defaultConfig.primary_color;
        document.body.style.background = `linear-gradient(135deg, ${bgColor}, ${adjustColor(bgColor, 20)})`;
      },
      mapToCapabilities: (config) => ({
        recolorables: [
          {
            get: () => config.bg_color || defaultConfig.bg_color,
            set: (value) => { config.bg_color = value; window.elementSdk.setConfig({ bg_color: value }); }
          },
          {
            get: () => config.surface_color || defaultConfig.surface_color,
            set: (value) => { config.surface_color = value; window.elementSdk.setConfig({ surface_color: value }); }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (value) => { config.text_color = value; window.elementSdk.setConfig({ text_color: value }); }
          },
          {
            get: () => config.primary_color || defaultConfig.primary_color,
            set: (value) => { config.primary_color = value; window.elementSdk.setConfig({ primary_color: value }); }
          },
          {
            get: () => config.accent_color || defaultConfig.accent_color,
            set: (value) => { config.accent_color = value; window.elementSdk.setConfig({ accent_color: value }); }
          }
        ],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined
      }),
      mapToEditPanelValues: (config) => new Map([
        ['game_title', config.game_title || defaultConfig.game_title],
        ['player_x_label', config.player_x_label || defaultConfig.player_x_label],
        ['player_o_label', config.player_o_label || defaultConfig.player_o_label]
      ])
    });

    function adjustColor(hex, percent) {
      const num = parseInt(hex.replace('#', ''), 16);
      const r = Math.min(255, Math.max(0, (num >> 16) + percent));
      const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + percent));
      const b = Math.min(255, Math.max(0, (num & 0x0000FF) + percent));
      return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
    }

    function setPlayerType(player, type) {
      gameState.players[player].type = type;
      
      const humanBtn = document.getElementById(`${player.toLowerCase()}-human-btn`);
      const botBtn = document.getElementById(`${player.toLowerCase()}-bot-btn`);
      const difficultyDiv = document.getElementById(`${player.toLowerCase()}-difficulty`);
      
      if (type === 'human') {
        humanBtn.classList.add('selected');
        humanBtn.classList.remove('border-red-500/30', 'border-cyan-500/30', 'text-red-300/70', 'text-cyan-300/70');
        humanBtn.classList.add('border-red-500/50', 'border-cyan-500/50');
        botBtn.classList.remove('selected');
        difficultyDiv.classList.add('hidden');
      } else {
        botBtn.classList.add('selected');
        humanBtn.classList.remove('selected');
        difficultyDiv.classList.remove('hidden');
        setBotDifficulty(player, 'normal');
      }
    }

    function setBotDifficulty(player, difficulty) {
      gameState.players[player].difficulty = difficulty;
      
      const buttons = document.querySelectorAll(`.${player.toLowerCase()}-diff-btn`);
      buttons.forEach(btn => {
        btn.classList.remove('ring-2', 'ring-white');
        if (btn.textContent.toLowerCase() === difficulty) {
          btn.classList.add('ring-2', 'ring-white');
        }
      });
    }

    function startGame() {
      // Collect all human players and prompt for names
      const humanPlayers = [];
      if (gameState.players.X.type === 'human') humanPlayers.push('X');
      if (gameState.players.O.type === 'human') humanPlayers.push('O');
      
      if (humanPlayers.length === 0) {
        // Both are bots, skip name entry
        startGamePlay();
      } else if (humanPlayers.length === 1) {
        // One human player
        gameState.humanPlayers[humanPlayers[0]] = 1;
        if (!gameState.players[humanPlayers[0]].name) {
          showNamePrompt(humanPlayers[0]);
        } else {
          startGamePlay();
        }
      } else {
        // Two human players
        if (!gameState.players.X.name) {
          gameState.humanPlayers.X = 1;
          showNamePrompt('X');
        } else if (!gameState.players.O.name) {
          gameState.humanPlayers.O = 1;
          showNamePrompt('O');
        } else {
          startGamePlay();
        }
      }
    }

    function showNamePrompt(player) {
      document.getElementById('name-prompt').textContent = player === 'X' ? 'Player X - Enter Your Name' : 'Player O - Enter Your Name';
      document.getElementById('setup-screen').classList.add('hidden');
      document.getElementById('name-screen').classList.remove('hidden');
      document.getElementById('player-name-input').focus();
    }

    function startGamePlay() {
      document.getElementById('setup-screen').classList.add('hidden');
      document.getElementById('name-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      
      const xLabel = gameState.players.X.name || (gameState.players.X.type === 'bot' ? `Bot (${gameState.players.X.difficulty})` : 'Player X');
      const oLabel = gameState.players.O.name || (gameState.players.O.type === 'bot' ? `Bot (${gameState.players.O.difficulty})` : 'Player O');
      
      document.getElementById('x-name').textContent = gameState.players.X.type === 'bot' ? `🤖 ${xLabel}` : xLabel;
      document.getElementById('o-name').textContent = gameState.players.O.type === 'bot' ? `🤖 ${oLabel}` : oLabel;
      
      initBoard();
      resetGame();
    }

    function initBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      
      for (let i = 0; i < 9; i++) {
        const cell = document.createElement('button');
        cell.id = `cell-${i}`;
        cell.className = 'cell-hover aspect-square bg-slate-800/50 rounded-xl border-2 border-slate-600/50 text-5xl md:text-6xl font-bold transition-all duration-200 flex items-center justify-center';
        cell.onclick = () => handleCellClick(i);
        board.appendChild(cell);
      }
    }

    function handleCellClick(index) {
      if (!gameState.gameActive || gameState.board[index] || gameState.players[gameState.currentPlayer].type === 'bot') {
        return;
      }
      
      makeMove(index);
    }

    function makeMove(index) {
      if (gameState.board[index] || !gameState.gameActive) return;
      
      gameState.board[index] = gameState.currentPlayer;
      updateCell(index);
      
      const result = checkWinner();
      if (result) {
        endGame(result);
        return;
      }
      
      gameState.currentPlayer = gameState.currentPlayer === 'X' ? 'O' : 'X';
      updateTurnIndicator();
      
      if (gameState.players[gameState.currentPlayer].type === 'bot' && gameState.gameActive) {
        setTimeout(() => makeBotMove(), 500);
      }
    }

    function updateCell(index) {
      const cell = document.getElementById(`cell-${index}`);
      const mark = gameState.board[index];
      
      if (mark === 'X') {
        cell.innerHTML = '<span class="x-mark">✕</span>';
      } else if (mark === 'O') {
        cell.innerHTML = '<span class="o-mark">○</span>';
      }
      cell.classList.add('disabled');
    }

    function updateTurnIndicator() {
      const indicator = document.getElementById('turn-indicator');
      const turnText = document.getElementById('turn-text');
      
      const playerName = gameState.players[gameState.currentPlayer].name || (gameState.currentPlayer === 'X' ? 'Player X' : 'Player O');
      const isBot = gameState.players[gameState.currentPlayer].type === 'bot';
      turnText.textContent = isBot ? `🤖 ${playerName} is thinking...` : `${playerName}'s Turn`;
      turnText.className = `font-bold text-lg ${gameState.currentPlayer === 'X' ? 'text-red-400' : 'text-cyan-400'}`;
    }

    function checkWinner() {
      for (const pattern of winPatterns) {
        const [a, b, c] = pattern;
        if (gameState.board[a] && gameState.board[a] === gameState.board[b] && gameState.board[a] === gameState.board[c]) {
          gameState.winningCells = pattern;
          return gameState.board[a];
        }
      }
      
      if (!gameState.board.includes('')) {
        return 'draw';
      }
      
      return null;
    }

    function endGame(result) {
      gameState.gameActive = false;
      
      // Highlight winning cells
      if (result !== 'draw') {
        gameState.winningCells.forEach(index => {
          const cell = document.getElementById(`cell-${index}`);
          cell.classList.add('winner-cell', 'winner-line');
        });
      }
      
      setTimeout(() => {
        showWinnerModal(result);
        updateScores(result);
      }, 500);
    }

    function showWinnerModal(result) {
      const modal = document.getElementById('winner-modal');
      const winnerIcon = document.getElementById('winner-icon');
      const winnerText = document.getElementById('winner-text');
      
      if (result === 'draw') {
        winnerIcon.textContent = '🤝';
        winnerText.textContent = "It's a Draw!";
        winnerText.className = 'text-3xl font-orbitron font-bold mb-6 text-slate-300';
      } else {
        const playerName = gameState.players[result].name || (result === 'X' ? 'Player X' : 'Player O');
        const isBot = gameState.players[result].type === 'bot';
        
        winnerIcon.textContent = isBot ? '🤖' : '🏆';
        winnerText.textContent = `${playerName} Wins!`;
        winnerText.className = `text-3xl font-orbitron font-bold mb-6 ${result === 'X' ? 'text-red-400' : 'text-cyan-400'}`;
      }
      
      modal.classList.remove('hidden');
    }

    function updateScores(result) {
      if (result === 'draw') {
        gameState.scores.draws++;
        document.getElementById('draws').textContent = gameState.scores.draws;
      } else {
        gameState.scores[result]++;
        document.getElementById(`${result.toLowerCase()}-score`).textContent = gameState.scores[result];
      }
    }

    function closeModal() {
      document.getElementById('winner-modal').classList.add('hidden');
    }

    function playAgain() {
      closeModal();
      resetGame();
    }

    function resetGame() {
      gameState.board = ['', '', '', '', '', '', '', '', ''];
      gameState.currentPlayer = 'X';
      gameState.gameActive = true;
      gameState.winningCells = [];
      
      // Reset all cells
      for (let i = 0; i < 9; i++) {
        const cell = document.getElementById(`cell-${i}`);
        cell.innerHTML = '';
        cell.classList.remove('disabled', 'winner-cell', 'winner-line');
      }
      
      updateTurnIndicator();
      
      // If first player is bot, make move
      if (gameState.players.X.type === 'bot') {
        setTimeout(() => makeBotMove(), 500);
      }
    }

    function backToSetup() {
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('setup-screen').classList.remove('hidden');
      gameState.scores = { X: 0, O: 0, draws: 0 };
      gameState.humanPlayers = { X: 0, O: 0 };
      gameState.players.X.name = '';
      gameState.players.O.name = '';
      document.getElementById('x-score').textContent = '0';
      document.getElementById('o-score').textContent = '0';
      document.getElementById('draws').textContent = '0';
    }

    function makeBotMove() {
      if (!gameState.gameActive) return;
      
      const difficulty = gameState.players[gameState.currentPlayer].difficulty;
      let move;
      
      switch (difficulty) {
        case 'easy':
          move = getRandomMove();
          break;
        case 'normal':
          move = Math.random() > 0.5 ? getBestMove() : getRandomMove();
          break;
        case 'hard':
          move = getBestMove();
          break;
      }
      
      if (move !== null) {
        makeMove(move);
      }
    }

    function getRandomMove() {
      const availableMoves = gameState.board
        .map((cell, index) => cell === '' ? index : null)
        .filter(index => index !== null);
      
      return availableMoves[Math.floor(Math.random() * availableMoves.length)];
    }

    function getBestMove() {
      const player = gameState.currentPlayer;
      const opponent = player === 'X' ? 'O' : 'X';
      
      // Check for winning move
      for (let i = 0; i < 9; i++) {
        if (gameState.board[i] === '') {
          gameState.board[i] = player;
          if (checkWinnerFor(player)) {
            gameState.board[i] = '';
            return i;
          }
          gameState.board[i] = '';
        }
      }
      
      // Block opponent's winning move
      for (let i = 0; i < 9; i++) {
        if (gameState.board[i] === '') {
          gameState.board[i] = opponent;
          if (checkWinnerFor(opponent)) {
            gameState.board[i] = '';
            return i;
          }
          gameState.board[i] = '';
        }
      }
      
      // Take center
      if (gameState.board[4] === '') return 4;
      
      // Take corners
      const corners = [0, 2, 6, 8].filter(i => gameState.board[i] === '');
      if (corners.length > 0) {
        return corners[Math.floor(Math.random() * corners.length)];
      }
      
      // Take any available
      return getRandomMove();
    }

    function checkWinnerFor(player) {
      for (const pattern of winPatterns) {
        const [a, b, c] = pattern;
        if (gameState.board[a] === player && gameState.board[b] === player && gameState.board[c] === player) {
          return true;
        }
      }
      return false;
    }
